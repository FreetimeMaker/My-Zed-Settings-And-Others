id = "java"
name = "Java"
version = "6.8.28"
schema_version = 1
description = "Java support."
repository = "https://github.com/zed-extensions/java"
authors = ["Java Extension Contributors"]
themes = []
icon_themes = []
languages = ["languages/gradle", "languages/properties", "languages/gradle-kts", "languages/java"]

[lib]
kind = "Rust"
version = "0.7.0"

[grammars.groovy]
repository = "https://github.com/murtaza64/tree-sitter-groovy"
rev = "deb0dcf8c4544f07564060f6e9b9f6e4b0bfc27d"

[grammars.java]
repository = "https://github.com/tree-sitter/tree-sitter-java"
rev = "94703d5a6bed02b98e438d7cad1136c01a60ba2c"

[grammars.kotlin]
repository = "https://github.com/fwcd/tree-sitter-kotlin"
rev = "1852ea17b7f60fb3f9d84e0b1555d56b46b39fb1"

[grammars.properties]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-properties"
rev = "579b62f5ad8d96c2bb331f07d1408c92767531d9"

[language_servers.gradle-language-server]
languages = ["Gradle", "Gradle KTS"]

[language_servers.gradle-language-server.language_ids]

[language_servers.jdtls]
language = "Java"
languages = []

[language_servers.jdtls.language_ids]

[context_servers]

[slash_commands]

[[capabilities]]
kind = "process:exec"
command = "*"
args = ["-version"]

[debug_adapters.Java]
